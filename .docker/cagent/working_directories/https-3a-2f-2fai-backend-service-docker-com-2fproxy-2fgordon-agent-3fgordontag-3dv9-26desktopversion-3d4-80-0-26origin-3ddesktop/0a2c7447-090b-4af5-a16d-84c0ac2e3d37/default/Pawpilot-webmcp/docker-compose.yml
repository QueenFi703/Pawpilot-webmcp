version: '3.9'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: pawpilot-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pawpilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pawpilot_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-pawpilot}
      POSTGRES_INITDB_ARGS: "-c shared_buffers=256MB -c max_connections=200"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pawpilot -d pawpilot"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pawpilot-network
    restart: unless-stopped

  # PawPilot Application
  pawpilot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pawpilot-app
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      DATABASE_URL: postgresql://${POSTGRES_USER:-pawpilot}:${POSTGRES_PASSWORD:-pawpilot_secure_password}@postgres:5432/${POSTGRES_DB:-pawpilot}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./dist:/app/dist
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - pawpilot-network
    restart: unless-stopped
    labels:
      com.example.description: "PawPilot - AI Pet Care Orchestration"
      com.docker.app.project: "pawpilot"

volumes:
  postgres_data:
    driver: local

networks:
  pawpilot-network:
    driver: bridge

# Docker Cloud / Deploy Labels
x-deploy: &deploy
  replicas: 1
  update_config:
    parallelism: 1
    delay: 10s
  restart_policy:
    condition: on-failure
    delay: 5s
    max_attempts: 3
